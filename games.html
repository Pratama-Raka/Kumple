<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Katalog Game | Kumple</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <header>
      <nav class="flex-row flex-wrap">
        <a href="index.html" class="logo">Kumple</a>

        <input type="checkbox" id="menu-toggle" class="peer sr-only" />
        <label for="menu-toggle" class="nav-toggle md:hidden">Menu</label>

        <ul
          class="nav-links hidden w-full flex-col gap-3 mt-3 peer-checked:flex md:mt-0 md:flex md:w-auto md:flex-row md:gap-6"
        >
          <li><a href="games.html" aria-current="page">Katalog Game</a></li>
          <li><a href="events.html">Event</a></li>
          <li><a href="about.html">Tentang</a></li>
          <li><a href="login.html">Log In</a></li>
          <li><a href="register.html">Register</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1 class="page-title">Katalog Game</h1>

      <form id="game-filter" action="#" method="get" class="filter-form flex flex-wrap items-end justify-center gap-4 px-0 py-0 max-[1000px]:justify-start max-[760px]:items-stretch max-[760px]:gap-3">
        <div class="field field-search">
          <label for="search" class="field-label">Cari game</label>
          <input
            type="search"
            id="search"
            name="search"
            placeholder="Nama game..."
            class="input"
          />
        </div>

        <div class="field">
          <label for="players" class="field-label">Jumlah pemain</label>
          <select id="players" name="players" class="input">
            <option value="">Semua</option>
            <option value="2">2 pemain</option>
            <option value="3-4">3-4 pemain</option>
            <option value="5+">5+ pemain</option>
          </select>
        </div>

        <div class="field">
          <label for="category" class="field-label">Kategori</label>
          <select id="category" name="category" class="input">
            <option value="">Semua</option>
            <option value="strategy">Strategy</option>
            <option value="party">Party</option>
            <option value="family">Family</option>
          </select>
        </div>

        <button type="submit" class="btn btn-red">Terapkan Filter</button>
      </form>
      <p id="game-filter-message" class="interaction-message" role="status" aria-live="polite"></p>

      <section
        class="game-list grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5"
        aria-live="polite"
      >
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Kumple. Dibuat untuk komunitas boardgame Bandung.</p>
    </footer>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
