<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In Kumple</title>
    <link rel="stylesheet" href="css/style.css"/>
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html">Kumple</a>
        <ul>
          <li><a href="games.html">Katalog Game</a></li>
          <li><a href="events.html">Event</a></li>
          <li><a href="about.html">Tentang</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1>Log In ke Kumple</h1>
      <table>
        <form action="#" method="post">
          <tr>
            <td>
              <label for="email">Email</label>
            </td>
            <td>
              <input type="email" id="email" name="email" required />
            </td>
          </tr>
          <tr>
            <td>
              <label for="password">Kata sandi</label>
            </td>
            <td>
              <input type="password" id="password" name="password" required />
            </td>
          </tr>
          <tr>
            <td>
              <button type="Log In">Log In</button>
            </td>
          </tr>
        </form>
      </table>

      <p>Belum punya akun? <a href="register.html">Register di sini</a></p>
    </main>

    <footer>
      <p>&copy; 2026 Kumple. Dibuat untuk komunitas boardgame Bandung.</p>
    </footer>
  </body>
</html>
