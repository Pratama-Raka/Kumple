<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event | Kumple</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <header>
      <nav class="flex-row flex-wrap">
        <a href="index.html" class="logo">Kumple</a>

        <input type="checkbox" id="menu-toggle" class="peer sr-only" />
        <label for="menu-toggle" class="nav-toggle md:hidden">Menu</label>

        <ul
          class="nav-links hidden w-full flex-col gap-3 mt-3 peer-checked:flex md:mt-0 md:flex md:w-auto md:flex-row md:gap-6"
        >
          <li><a href="games.html">Katalog Game</a></li>
          <li><a href="events.html" aria-current="page">Event</a></li>
          <li><a href="about.html">Tentang</a></li>
          <li><a href="login.html">Log In</a></li>
          <li><a href="register.html">Register</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="page-head flex flex-wrap items-end justify-between gap-4 pt-0 pb-0">
        <h1 class="page-title page-title-short">Event Mendatang</h1>
        <a href="create-event.html" class="btn btn-yellow mb-1">Buat Event Baru</a>
      </div>

      <form id="event-filter" action="#" method="get" class="filter-form flex flex-wrap items-end justify-center gap-4 px-0 py-0 max-[1000px]:justify-start max-[760px]:items-stretch max-[760px]:gap-3">
        <div class="field">
          <label for="venue" class="field-label">Venue</label>
          <select id="venue" name="venue" class="input">
            <option value="">Semua venue</option>
            <option value="kopi-session">Kopi Session, Dago</option>
            <option value="board-brew">Board &amp; Brew, Buah Batu</option>
          </select>
        </div>

        <div class="field">
          <label for="tanggal" class="field-label">Tanggal</label>
          <input type="date" id="tanggal" name="tanggal" class="input" />
        </div>

        <button type="submit" class="btn btn-red">Terapkan Filter</button>
      </form>
      <p id="event-filter-message" class="interaction-message" role="status" aria-live="polite"></p>
      <section class="event-list grid grid-cols-1 gap-x-7 gap-y-10 pb-16 md:grid-cols-2 xl:grid-cols-3" aria-live="polite">
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Kumple. Dibuat untuk komunitas boardgame Bandung.</p>
    </footer>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
