<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Kumple</title>
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html">Kumple</a>
        <ul>
          <li><a href="games.html">Katalog Game</a></li>
          <li><a href="events.html">Event</a></li>
          <li><a href="about.html">Tentang</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1>Buat Akun Kumple</h1>

      <table>
        <form action="#" method="post">
          <tr>
            <td>
              <label for="nama">Nama lengkap</label>
            </td>
            <td>
              <input type="text" id="nama" name="nama" required />
            </td>
          </tr>
          <tr>
            <td>
              <label for="email">Email</label>
            </td>
            <td>
              <input type="email" id="email" name="email" required />
            </td>
          </tr>
          <tr>
            <td>
              <label for="password">Kata sandi</label>
            </td>
            <td>
              <input
                type="password"
                id="password"
                name="password"
                required
                minlength="8"
              />
            </td>
          </tr>
          <tr>
            <td>
              <button type="Regist">Regist</button>
            </td>
          </tr>
        </form>
      </table>
      <p>Sudah punya akun? <a href="login.html">Log In di sini</a></p>
    </main>

    <footer>
      <p>&copy; 2026 Kumple. Dibuat untuk komunitas boardgame Bandung.</p>
    </footer>
  </body>
</html>
