<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Kumple</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <header>
      <nav class="flex-row flex-wrap">
        <a href="index.html" class="logo">Kumple</a>

        <input type="checkbox" id="menu-toggle" class="peer sr-only" />
        <label for="menu-toggle" class="nav-toggle md:hidden">Menu</label>

        <ul
          class="nav-links hidden w-full flex-col gap-3 mt-3 peer-checked:flex md:mt-0 md:flex md:w-auto md:flex-row md:gap-6"
        >
          <li><a href="games.html">Katalog Game</a></li>
          <li><a href="events.html">Event</a></li>
          <li><a href="about.html">Tentang</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1 class="page-title page-title-short">Buat Akun Kumple</h1>

      <section class="auth grid grid-cols-1 items-center gap-x-16 gap-y-8 md:grid-cols-[minmax(0,480px)_1fr]">
        <form action="#" method="post" class="form-card">
          <span class="game-tile tile-9" aria-hidden="true"></span>
          <div class="field">
            <label for="nama" class="field-label">Nama lengkap</label>
            <input type="text" id="nama" name="nama" class="input" required />
          </div>
          <div class="field">
            <label for="email" class="field-label">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              class="input"
              required
            />
          </div>
          <div class="field">
            <label for="password" class="field-label">Kata sandi</label>
            <input
              type="password"
              id="password"
              name="password"
              class="input"
              required
              minlength="8"
            />
          </div>
          <button type="submit" class="btn btn-red">Regist</button>
        </form>

        <div class="auth-art art-pieces" aria-hidden="true"></div>

        <p class="auth-switch">
          Sudah punya akun? <a href="login.html">Log In di sini</a>
        </p>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Kumple. Dibuat untuk komunitas boardgame Bandung.</p>
    </footer>
  </body>
</html>
