<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buat Event Baru | Kumple</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <header>
      <nav class="flex-row flex-wrap">
        <a href="index.html" class="logo">Kumple</a>

        <input type="checkbox" id="menu-toggle" class="peer sr-only" />
        <label for="menu-toggle" class="nav-toggle md:hidden">Menu</label>

        <ul
          class="nav-links hidden w-full flex-col gap-3 mt-3 peer-checked:flex md:mt-0 md:flex md:w-auto md:flex-row md:gap-6"
        >
          <li><a href="games.html">Katalog Game</a></li>
          <li><a href="events.html" aria-current="page">Event</a></li>
          <li><a href="about.html">Tentang</a></li>
          <li><a href="login.html">Log In</a></li>
          <li><a href="register.html">Register</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1 class="page-title page-title-short">Buat Event Baru</h1>

      <div class="form-wrap">
        <form action="#" method="post" class="form-card event-form flex flex-col gap-6 p-6 md:p-10 max-[760px]:gap-5">
          <h3 class="form-heading">Detail Event</h3>

          <div class="grid gap-6 md:grid-cols-3">
            <div class="field md:col-span-2">
              <label for="nama-event" class="field-label">Nama event</label>
              <input
                type="text"
                id="nama-event"
                name="nama-event"
                placeholder="Masukkan Nama Event"
                class="input"
                required
              />
            </div>
            <div class="field">
              <label for="venue" class="field-label">Venue</label>
              <select id="venue" name="venue" class="input" required>
                <option value="">Pilih venue</option>
                <option value="kopi-session">Kopi Session, Dago</option>
                <option value="board-brew">Board &amp; Brew, Buah Batu</option>
              </select>
            </div>
            <div class="field col-span-full">
              <label for="deskripsi" class="field-label">Deskripsi</label>
              <textarea
                id="deskripsi"
                name="deskripsi"
                rows="4"
                placeholder="Deskripsikan Event"
                class="input"
              ></textarea>
            </div>
            <div class="field">
              <label for="tanggal" class="field-label">Tanggal</label>
              <input
                type="date"
                id="tanggal"
                name="tanggal"
                class="input"
                required
              />
            </div>
            <div class="field">
              <label for="waktu" class="field-label">Waktu mulai</label>
              <input
                type="time"
                id="waktu"
                name="waktu"
                class="input"
                required
              />
            </div>
            <div class="field">
              <label for="slot" class="field-label">Jumlah slot peserta</label>
              <input
                type="number"
                id="slot"
                name="slot"
                min="2"
                max="30"
                value="8"
                class="input"
                required
              />
            </div>
          </div>

          <fieldset class="game-picks flex flex-wrap gap-4 px-5 pt-3 pb-5">
            <legend>Game yang akan dimainkan</legend>

            <label for="game-1" class="game-pick flex items-center gap-2.5">
              <input type="checkbox" id="game-1" name="game" value="catan" />
              <span>Catan</span>
            </label>
            <label for="game-2" class="game-pick flex items-center gap-2.5">
              <input type="checkbox" id="game-2" name="game" value="ttr" />
              <span>Ticket to Ride</span>
            </label>
            <label for="game-3" class="game-pick flex items-center gap-2.5">
              <input
                type="checkbox"
                id="game-3"
                name="game"
                value="codenames"
              />
              <span>Codenames</span>
            </label>
          </fieldset>

          <button type="submit" class="btn btn-red self-start m-0">Buat Event</button>
        </form>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 Kumple. Dibuat untuk komunitas boardgame Bandung.</p>
    </footer>
  </body>
</html>
