<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buat Event Baru - Kumple</title>
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html">Kumple</a>
        <ul>
          <li><a href="games.html">Katalog Game</a></li>
          <li><a href="events.html">Event</a></li>
          <li><a href="about.html">Tentang</a></li>
          <li><a href="login.html">Log In</a></li>
          <li><a href="register.html">Register</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1>Buat Event Baru</h1>

      <form action="#" method="post">
        <h3>Detail Event</h3>
        <table width="500" height="30">
          <tr>
            <td colspan="2">
              <label for="nama-event">Nama event</label>
              <input
                type="text"
                id="nama-event"
                name="nama-event"
                placeholder="Masukkan Nama Event"
                required
              />
            </td>
            <td colspan="2">
              <label for="venue">Venue</label>
              <select id="venue" name="venue" required>
                <option value="">Pilih venue</option>
                <option value="kopi-session">Kopi Session, Dago</option>
                <option value="board-brew">Board &amp; Brew, Buah Batu</option>
              </select>
            </td>
          </tr>
          <tr>
            <td>
              <label for="deskripsi">Deskripsi</label>
            </td>
            <td colspan="3">
              <textarea
                id="deskripsi"
                name="deskripsi"
                rows="4"
                cols="30"
                placeholder="Deskripsikan Event"
              ></textarea>
            </td>
          </tr>
          <tr>
            <td>
              <label for="tanggal">Tanggal</label>
              <input type="date" id="tanggal" name="tanggal" required />
            </td>
            <td>
              <label for="waktu">Waktu mulai</label>
              <input type="time" id="waktu" name="waktu" required />
            </td>
            <td>
              <label for="slot">Jumlah slot peserta</label>
              <input
                type="number"
                id="slot"
                name="slot"
                min="2"
                max="30"
                value="8"
                required
              />
            </td>
          </tr>
        </table>

        <fieldset style="width: 30%;">
          <legend>Game yang akan dimainkan</legend>

          <label for="game-1"
            ><input type="checkbox" id="game-1" name="game" value="catan" />
            Catan</label
          >
          <label for="game-2"
            ><input type="checkbox" id="game-2" name="game" value="ttr" />
            Ticket to Ride</label
          >
          <label for="game-3"
            ><input type="checkbox" id="game-3" name="game" value="codenames" />
            Codenames</label
          >
        </fieldset>
        <br>
        <button type="submit">Buat Event</button>
      </form>
    </main>

    <footer>
      <p>&copy; 2026 Kumple. Dibuat untuk komunitas boardgame Bandung.</p>
    </footer>
  </body>
</html>
